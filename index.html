<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#26a57b" />
  <title>3-2 青春練功－不炫耀｜分支情境遊戲</title>
  <style>
    :root{
      --bg1:#fff7d9; --bg2:#e9fff4; --bg3:#eaf2ff;
      --card:#ffffff; --ink:#22312d; --muted:#65746f;
      --main:#26a57b; --main-dark:#13705a; --accent:#ffb84c; --accent2:#6c7df7;
      --main2:#dcfff1; --line:#d6ebe4; --warn:#fff2c4; --soft:#f6fbf8;
      --shadow:0 18px 40px rgba(24,91,72,.13);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      background:
        radial-gradient(circle at 10% 10%,rgba(255,207,91,.34),transparent 28%),
        radial-gradient(circle at 88% 14%,rgba(108,125,247,.20),transparent 26%),
        radial-gradient(circle at 50% 96%,rgba(38,165,123,.22),transparent 32%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3));
      font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
      color:var(--ink);
    }
    .wrap{max-width:1040px;margin:0 auto;padding:26px 16px 42px;position:relative}
    .wrap:before,.wrap:after{content:"";position:fixed;border-radius:50%;z-index:-1;opacity:.55}
    .wrap:before{width:160px;height:160px;background:#ffe08a;left:-50px;top:90px}
    .wrap:after{width:220px;height:220px;background:#c9f7e5;right:-70px;bottom:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:13px}
    .logo{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--main),#55d69f);color:#fff;display:grid;place-items:center;font-weight:1000;box-shadow:0 10px 22px rgba(38,165,123,.26);transform:rotate(-4deg)}
    h1{font-size:30px;margin:0;letter-spacing:.05em;color:#153f35}
    .sub{font-size:14px;color:var(--muted);margin-top:4px}
    .pill{font-size:13px;padding:9px 13px;border-radius:999px;background:#fff;border:1px solid #dceee8;color:#1f5d4e;font-weight:800;white-space:nowrap;box-shadow:0 8px 18px rgba(34,49,45,.06)}
    .card{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:1px solid rgba(214,235,228,.95);border-radius:28px;box-shadow:var(--shadow);padding:26px;margin-top:14px;position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--main),#7bdba9,var(--accent),var(--accent2))}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
    .node{font-size:13px;color:#4d6760;font-weight:900;background:#f3fbf7;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    .progress{height:13px;background:#e8f2ee;border-radius:999px;overflow:hidden;min-width:220px;border:1px solid #d7e9e2}
    .bar{height:100%;background:linear-gradient(90deg,var(--main),#ffca5c);width:0;transition:.25s;border-radius:999px}
    .scene-title{font-size:24px;font-weight:1000;margin:8px 0 12px;color:#174f42;display:flex;align-items:center;gap:8px}
    .scene-title:before{content:"🎮";font-size:24px}
    .scene-text{font-size:19px;line-height:1.85;background:linear-gradient(180deg,#f8fffb,#f1fbf6);border:1px solid var(--line);border-left:8px solid var(--main);border-radius:20px;padding:20px;margin:14px 0 18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65)}
    .choices{display:grid;grid-template-columns:1fr;gap:13px;margin-top:12px}
    button{font-family:inherit;cursor:pointer;border:0}
    .choice{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:22px;padding:17px 18px;font-size:17px;line-height:1.55;color:var(--ink);transition:.16s;display:flex;align-items:flex-start;gap:11px;box-shadow:0 8px 18px rgba(34,49,45,.045)}
    .choice:hover,.choice:focus-visible{border-color:var(--main);transform:translateY(-2px) scale(1.005);box-shadow:0 14px 24px rgba(38,165,123,.15);background:#fcfffd;outline:none}
    .choice b{display:inline-grid;place-items:center;min-width:38px;height:38px;background:linear-gradient(135deg,var(--main2),#fff6cf);color:#17614f;border-radius:14px;padding:0 8px;font-weight:1000;border:1px solid #d0f1e2}
    .choice .ctext{flex:1}.choice .icon{font-size:24px;line-height:1.45}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .btn{background:linear-gradient(135deg,var(--main),#22bf8b);color:#fff;border-radius:16px;padding:12px 17px;font-weight:900;font-size:15px;box-shadow:0 10px 20px rgba(38,165,123,.18)}
    .btn:hover{transform:translateY(-1px)}
    .btn.secondary{background:#eef8f4;color:#31594f;box-shadow:none}
    .btn.ghost{background:transparent;color:#31594f;border:1px solid var(--line);box-shadow:none}
    .home{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:stretch}
    .infoBox{background:linear-gradient(180deg,#f7fffb,#fff);border-radius:22px;padding:19px;border:1px solid var(--line)}
    .infoBox h3{margin:0 0 8px;color:#174f42}.infoBox ul{margin:8px 0 0;padding-left:1.2em;line-height:1.9}
    .bigStart{font-size:18px;padding:15px 23px;border-radius:18px}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .resultBox{border:1px solid var(--line);border-radius:20px;padding:17px;background:#fff;box-shadow:0 8px 18px rgba(34,49,45,.04)}
    .resultBox h3{margin:0 0 10px;font-size:17px;color:#174f42}
    .path{font-size:22px;font-weight:1000;color:#17614f;background:linear-gradient(135deg,var(--main2),#fff3c8);display:inline-block;padding:9px 13px;border-radius:14px;margin-bottom:12px;border:1px solid #cdeee0}
    .cert{background:linear-gradient(135deg,var(--warn),#fff8df);border:1px solid #f0d891;text-align:center;font-size:20px;font-weight:1000;color:#7a5a00}
    .mascot{font-size:58px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 8px 12px rgba(34,49,45,.08))}
    .home-title{font-size:28px;font-weight:1000;color:#174f42;margin:0 0 8px}
    .home-sub{color:#5f716c;line-height:1.7;margin:0 0 10px}
    .scene-image-wrap{margin:12px 0 16px;border-radius:24px;overflow:hidden;border:1px solid rgba(214,235,228,.95);background:#eef8f4;box-shadow:0 14px 30px rgba(34,49,45,.09)}
    .scene-image{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eef8f4}
    .result-hero{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start;margin-bottom:14px}
    .trophy-card{display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#fff6c9,#fff);border:1px solid #f0d891;border-radius:24px;padding:14px;box-shadow:0 12px 24px rgba(122,90,0,.12)}
    .trophy-img{width:100%;max-width:280px;border-radius:18px;display:block}
    .trophy-note{font-size:13px;color:#7a5a00;font-weight:900;text-align:center;margin-top:8px}
    .cert.pass{background:linear-gradient(135deg,#fff0a6,#fff9da);border-color:#e7c448}
    .cert.retry{background:linear-gradient(135deg,#eef8f4,#fff);border-color:var(--line);color:#31594f}
    .cert-stamp{margin:.35em 0 0;font-size:1.05em;font-weight:1000;color:#7a5a00}
    @media(max-width:720px){
      .home,.result-grid,.result-hero{grid-template-columns:1fr}
      header{align-items:flex-start;flex-direction:column}.pill{white-space:normal}
      .scene-text{font-size:17px}.choice{font-size:16px;padding:15px}h1{font-size:24px}.progress{min-width:140px}.card{padding:21px}
      .trophy-img{max-width:320px}
    }
  
/* 與月經教育新版一致的紙感拼貼視覺：保留原始遊戲場景圖片 */
:root{--bg1:#f4e3c6;--bg2:#fdf1df;--bg3:#e1efe8;--card:#fff9ee;--ink:#2d2924;--muted:#665e55;--main:#21876c;--main-dark:#15634e;--accent:#edb957;--line:#5f675b;--shadow:8px 10px 0 rgba(43,35,27,.13)}
body{background:repeating-linear-gradient(0deg,rgba(63,50,36,.024) 0 1px,transparent 1px 6px),linear-gradient(135deg,var(--bg1),var(--bg2) 48%,var(--bg3))}
.card{background:var(--card);border:3px solid #302c28;border-radius:19px;box-shadow:var(--shadow);backdrop-filter:none}
.card:before{background:linear-gradient(90deg,#e5b852,#df8061,#6c9db3,#21876c);height:10px}
.logo{border:2px solid #302c28;border-radius:14px;box-shadow:4px 5px 0 rgba(43,35,27,.12)}
.pill,.node{border:2px solid #302c28;border-radius:12px;background:#fff8eb}
.infoBox,.scene-text,.resultBox,.scene-image-wrap,.trophy-card{border:2px solid #302c28;border-radius:16px;box-shadow:4px 5px 0 rgba(43,35,27,.09)}
.scene-text{background:#fff7e5;border-left:7px solid #21876c}
.choice{border:2px solid #766f61;background:#fffefa;border-radius:15px;box-shadow:3px 4px 0 rgba(43,35,27,.08);min-height:64px}
.choice:hover,.choice:focus-visible{border-color:#21876c;background:#f0fff7}
.choice .ctext{display:flex;flex-direction:column;gap:4px}
.choice-tag{display:inline-flex;align-self:flex-start;padding:3px 9px;background:#fff0c6;color:#5f3c22;border:1px solid #987747;border-radius:8px;font-size:14px;font-weight:900;letter-spacing:.07em}
.choice-detail{display:block;line-height:1.65}
.choice b{background:#e5f5e9;border:1px solid #302c28;border-radius:9px}
.btn{min-height:46px;border:2px solid #302c28;border-radius:12px;box-shadow:3px 4px 0 rgba(43,35,27,.10)}
.btn.secondary{background:#f5ebd6}.btn.ghost{background:#fffefa;border:2px solid #302c28}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.choice:focus-visible{outline:3px solid #9c7ad5;outline-offset:3px}
.learning-note{padding:10px 14px;margin:5px 0 14px;border-left:5px solid #d7a04b;background:#fff0d0;border-radius:8px;color:#65503a;font-weight:800}
@media(max-width:720px){
 .wrap{padding:12px 10px 28px}.card{padding:17px}
 .actions{display:grid;grid-template-columns:1fr;gap:10px}.actions .btn{width:100%}
 .choice{padding:12px;gap:9px}.choice .icon{font-size:20px}
 .choice b{min-width:32px;height:32px}.choice-detail{font-size:16px}
 .result-grid{grid-template-columns:1fr}.scene-text{font-size:17px;padding:15px}
 .result-hero{grid-template-columns:1fr}.scene-title{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">3-2</div>
        <div>
          <h1>3-2 青春練功－不炫耀</h1>
          <div class="sub">技能學習｜同儕壓力判斷、表達立場與情境練習</div>
        </div>
      </div>
      <div class="pill">任務挑戰</div>
    </header>
    <main id="app"></main>
  </div>

<script>
const sceneImages={
  S0:"images/scene_s0_start.png",
  A1:"images/scene_a1_brag_to_fit_in.png",
  A2:"images/scene_a2_brag_too_far.png",
  AB2:"images/scene_ab2_change_topic_reflect.png",
  AC2:"images/scene_ac2_admit_to_friend.png",
  B1:"images/scene_b1_listen_then_questioned.png",
  BA2:"images/scene_ba2_reject_comparison.png",
  BB2:"images/scene_bb2_vague_answer_reflect.png",
  BC2:"images/scene_bc2_defensive_comeback.png",
  C1:"images/scene_c1_direct_confrontation.png",
  CA2:"images/scene_ca2_calm_explanation.png",
  CB2:"images/scene_cb2_argument_escalates.png",
  CC2:"images/scene_cc2_walk_away_uncertain.png"
};
const trophyImage="images/trophy_success_code_7034.png";
const passPaths=new Set(["BAA","CAA","CCA"]);

const story={
  S0:{level:1,title:"起始情境",text:"下課時，幾個同學圍在一起大聊感情史、炫耀性經驗，還笑說：『現在母胎單身也太遜了吧！』大家狂起鬨、越講越誇張，這時所有人突然轉頭盯著你看。",choices:[
    {key:"A",label:"不甘示弱：隨便掰一點，免得被笑太菜。",next:"A1",step:"隨便掰點免被笑"},
    {key:"B",label:"按兵不動：保持冷靜不做反應，先聽聽看就好。",next:"B1",step:"先冷靜聽聽就好"},
    {key:"C",label:"直球對決：表達『欸，說這些很幼稚，你們超無聊的！』",next:"C1",step:"嗆幼稚你們無聊"}
  ]},
  A1:{level:2,title:"你也跟著吹牛",text:"為了不被笑，你也跟著吹牛畫大餅。大家聽得津津有味，但你心裡其實超心虛。",choices:[
    {key:"A'",label:"變本加厲：繼續加碼，把自己越講越神。",next:"A2",step:"加碼把自己講神"},
    {key:"B'",label:"轉移陣地：見好就收，趕快把話題轉開。",next:"AB2",step:"趕快把話題轉開"},
    {key:"C'",label:"坦白從寬：私下跟麻吉承認自己剛剛在唬爛。",next:"AC2",step:"私下認剛剛唬爛"}
  ]},
  A2:{level:3,title:"牛皮越吹越大",text:"牛皮越吹越大，氣氛雖然很嗨，但有人開始露出『真假？』的表情。隔天甚至有人在背後酸你愛吹牛。",choices:[
    {key:"A''",label:"硬撐到底：繼續假裝，死命維持人設。",end:"AAA",step:"死命維持假人設"},
    {key:"B''",label:"懸崖勒馬：反省自己幹嘛把炫耀當飯吃。",end:"AAB",step:"反省幹嘛瞎炫耀"},
    {key:"C''",label:"惱羞成怒：怪同學太八卦，千錯萬錯都不是我的錯。",end:"AAC",step:"怪同學太愛八卦"}
  ]},
  AB2:{level:3,title:"話題散了，但你開始反思",text:"你沒繼續掰，話題也就散了。雖然安全下莊，但你忍不住懷疑人生：我剛剛到底在怕什麼？",choices:[
    {key:"A''",label:"莫忘初衷：告訴自己感情的重點是真心，不是來炫耀的。",end:"ABA",step:"感情真心不炫耀"},
    {key:"B''",label:"杞人憂天：覺得下次還是得先準備好台詞才不會輸。",end:"ABB",step:"下次先備好台詞"},
    {key:"C''",label:"隨波逐流：決定先暗中觀察，看風向跟著說。",end:"ABC",step:"看風向跟著瞎說"}
  ]},
  AC2:{level:3,title:"你私下坦白",text:"你私下坦白只是怕被笑才吹牛，麻吉聽完回：『你其實也知道比這個超沒意義吧？』",choices:[
    {key:"A''",label:"坦承不諱：承認自己腦波弱，被大家影響了。",end:"ACA",step:"承認被大家影響"},
    {key:"B''",label:"推卸責任：雙手一攤，說反正大家都在吹牛。",end:"ACB",step:"反正大家都在吹"},
    {key:"C''",label:"執迷不悟：求麻吉幫忙想一套更神的劇本，下次繼續用。",end:"ACC",step:"想更神劇本續用"}
  ]},
  B1:{level:2,title:"你先保持冷靜",text:"你沒立馬跟著起鬨，只是在旁邊聽。有人突然盯著你問：『所以你到底有沒有經驗？該不會還是單身小白吧？』",choices:[
    {key:"A'",label:"拒絕比較：『沒什麼好比，我不用經驗值來肯定自己的價值。』",next:"BA2",step:"經驗不定義價值"},
    {key:"B'",label:"打模糊仗：『我當然有啦，只是不想講而已。』",next:"BB2",step:"不想講含糊過關"},
    {key:"C'",label:"霸氣反嗆：『少囉唆，我有沒有，關你什麼事！』",next:"BC2",step:"少囉唆不關你事"}
  ]},
  BA2:{level:3,title:"你拒絕被比較定義",text:"你堅定講完後，有人笑，也有人安靜了。你發現其實不是大家都愛這種無聊的比較。",choices:[
    {key:"A''",label:"乘勝追擊：自我增強『親密關係看的是誠意，又不是在趕火車。』",end:"BAA",step:"真誠不需趕火車"},
    {key:"B''",label:"點到為止：不再多說表態，有人喜歡去比較無所謂。",end:"BAB",step:"別人愛比無所謂"},
    {key:"C''",label:"教訓說教：開啟碎念模式，反過來斥責大家。",end:"BAC",step:"開啟碎念斥責風"}
  ]},
  BB2:{level:3,title:"含糊過關，但心裡仍受影響",text:"你用模糊方式保住了面子，大家雖然沒追問，但你心裡明白自己還是受了些影響，被帶風向了。",choices:[
    {key:"A''",label:"自我提醒：雖感到壓力，但不靠迎合大家來換取認同。",end:"BBA",step:"不迎合換取認同"},
    {key:"B''",label:"含糊過關：覺得這招超好用，以後被問都裝傻帶過。",end:"BBB",step:"以後被問都裝傻"},
    {key:"C''",label:"庸人自擾：開始焦慮，想著是不是趕快脫單、追進度。",end:"BBC",step:"開始焦慮拼脫單"}
  ]},
  BC2:{level:3,title:"反嗆讓氣氛對立",text:"你直接嗆爆，對方也回頂你，氣氛瞬間對立。你雖然表達生氣情緒，沒被影響，但也沒把自己的想法說清楚。",choices:[
    {key:"A''",label:"亡羊補牢：之後找好時機，好好講清楚自己的想法。",end:"BCA",step:"找時機講清想法"},
    {key:"B''",label:"逞強好勝：覺得只要吵架沒有輸就好，其他都不重要。",end:"BCB",step:"吵架沒有輸就好"},
    {key:"C''",label:"走為上策：以後看到這群人就閃，眼不見為淨。",end:"BCC",step:"看到這群人就閃"}
  ]},
  C1:{level:2,title:"你直接指出他們很幼稚",text:"你直接說他們幼稚、無聊，幾個人秒變臉，反酸你：『你是不是眼紅我們經驗豐富，才在那邊酸啊？』",choices:[
    {key:"A'",label:"以柔克剛：語氣淡定『拿性經驗來炫耀很瞎欸，不值得我羨慕。』",next:"CA2",step:"拿性炫耀超瞎的"},
    {key:"B'",label:"奉陪到底：找人來助陣，死都要嗆贏對方。",next:"CB2",step:"找人助陣死要贏"},
    {key:"C'",label:"多說無益：懶得跟他們廢話，直接轉身走人。",next:"CC2",step:"懶得廢話轉身走"}
  ]},
  CA2:{level:3,title:"你把立場講清楚",text:"你把話講明白後，雖然有人還在嘴硬，但也沒人敢再逼問。你成功把風向從『比經驗』帶回『做自己』。",choices:[
    {key:"A''",label:"堅定立場：我羨慕的是理性思考，不是無腦跟風比經驗。",end:"CAA",step:"做自己不盲跟風"},
    {key:"B''",label:"怕被排擠：下次識相點比較好，話不必講那麼清楚。",end:"CAB",step:"話不必講太清楚"},
    {key:"C''",label:"指桑罵槐：公開侮辱嘴硬愛比較的人，請大家來公審。",end:"CAC",step:"公開公審愛比者"}
  ]},

const STORAGE_KEY="youthNoBragSkillV3";
let current="home";
let path=[];
let steps=[];
let nodeHistory=[];
let endKeySaved=null;
const app=document.getElementById("app");
function displayKey(k){return String(k).replace(/[’']/g,"")}
function displayRouteFromEnd(endKey){return String(endKey).replace(/^END_/,"").split("").join(" > ")}
function loadProgress(){
  try{
    const v=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(v && (story[v.current] || (v.current==="end" && feedback[v.endKey])) &&
        Array.isArray(v.path) && Array.isArray(v.steps) && Array.isArray(v.nodeHistory)) return v;
  }catch(e){}
  return null;
}
function saveProgress(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({current,path,steps,nodeHistory,endKey:endKeySaved}));}catch(e){}
}
function resetState(){
  path=[];steps=[];nodeHistory=[];current="home";endKeySaved=null;
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
}
function startChallenge(){resetState();go("S0")}
function resumeChallenge(){
  const saved=loadProgress();
  if(!saved){startChallenge();return;}
  current=saved.current;path=[...saved.path];steps=[...saved.steps];nodeHistory=[...saved.nodeHistory];endKeySaved=saved.endKey||null;
  if(current==="end") renderEnd(endKeySaved);
  else renderNode(current);
}
function goBack(){
  if(!nodeHistory.length)return;
  const previous=nodeHistory.pop();
  if(path.length)path.pop();
  if(steps.length)steps.pop();
  current=previous;endKeySaved=null;
  saveProgress();renderNode(previous);
}
function restartChallenge(requireConfirm=true){
  if(requireConfirm && !confirm("確定清除這次挑戰紀錄並重新開始嗎？"))return;
  resetState();window.location.reload();
}
function returnHome(){
  if(confirm("返回首頁會清除目前挑戰進度，確定嗎？"))renderHome();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function renderHome(preserveProgress=false){
  if(!preserveProgress) resetState();
  const canResume=!!loadProgress();
  app.innerHTML=`
    <section class="card home">
      <div>
        <div class="mascot">🛡️</div>
        <div class="home-title">3-2 青春練功－不炫耀｜任務啟動</div>
        <p class="home-sub">你將進入一個同學討論感情與性經驗的情境。面對起鬨、比較與追問時，每一步選擇都會影響最後結果。</p>
        <div class="scene-text">任務目標：理性因應同儕性炫耀與性比較。</div>
        <div class="actions"><button class="btn bigStart" onclick="startChallenge()">開始新挑戰</button>${canResume ? '<button class="btn secondary" onclick="resumeChallenge()">繼續上次挑戰</button>' : ''}</div>
      </div>
      <div class="infoBox">
        <h3>遊戲說明</h3>
        <ul>
          <li>遊戲共有三個情境階段，每一階段都要做出一個選擇。</li>
          <li>你的選擇會影響後續情境，最後形成不同的行動路徑與結果。</li>
          <li>每個選項先顯示四字行為標籤，幫助你辨認採取的策略。</li>
          <li>完成三次選擇後，系統會整理因應行動，提供個別回饋與建議。</li>
          <li>可返回上一個情境重新選擇；重新整理後也能繼續尚未完成的挑戰。</li>
          <li>部分路徑可以成功通關；未通關時，可重新挑戰並嘗試不同選擇。</li>
        </ul>
      </div>
    </section>`;
}
function go(id){if(story[current])nodeHistory.push(current);current=id;endKeySaved=null;saveProgress();renderNode(id)}
function choose(nodeId,index){
  const ch=story[nodeId].choices[index];
  path.push(displayKey(ch.key));
  steps.push(ch.step);
  if(ch.next){go(ch.next)}else{renderEnd(ch.end)}
}
function renderNode(id){
  const n=story[id];
  const percent=n.level===1?15:n.level===2?50:82;
  app.innerHTML=`
    <section class="card">
      <div class="topline"><div class="node">任務進度｜第 ${n.level} 回合</div><div class="progress"><div class="bar" style="width:${percent}%"></div></div></div>
      <div class="scene-title">${esc(n.title)}</div><div class="learning-note">行動策略辨識｜觀察情境差異，選出你認為合適的回應方式。</div>
      <div class="scene-image-wrap"><img class="scene-image" src="${sceneImages[id]}" alt="${esc(n.title)}"></div>
      <div class="scene-text">${esc(n.text)}</div>
      <div class="choices">
        ${n.choices.map((c,i)=>`<button class="choice" onclick="choose('${id}',${i})"><b>${String.fromCharCode(65+i)}</b><span class="icon">${["💬","🧠","🛡️"][i]}</span><span class="ctext"><span class="choice-tag">${esc(c.label.split("：")[0])}</span><span class="choice-detail">${esc(c.label.split("：").slice(1).join("："))}</span></span></button>`).join("")}
      </div>
      <div class="actions"><button class="btn secondary" onclick="goBack()" ${!nodeHistory.length?'disabled':''}>上一個情境</button><button class="btn ghost" onclick="returnHome()">回首頁</button><button class="btn ghost" onclick="restartChallenge()">重新開始</button></div>
    </section>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderEnd(endKey){
  if(current!=="end" && story[current])nodeHistory.push(current);
  current="end";endKeySaved=endKey;saveProgress();
  const fb=feedback[endKey]||["","",""];
  const route=displayRouteFromEnd(endKey);
  const actionList=steps.slice(-3).map((s,i)=>`${i+1}. ${esc(s)}`).join("<br>");
  const isPass=passPaths.has(endKey);
  const trophyBlock=isPass?`
    <div class="trophy-card">
      <div>
        <img class="trophy-img" src="${trophyImage}" alt="成功通關獎盃，青春密碼 7034">
        <div class="trophy-note">通關密碼：7034</div>
      </div>
    </div>`:"";
  app.innerHTML=`
    <section class="card">
      <div class="topline"><div class="node">挑戰完成</div><div class="progress"><div class="bar" style="width:100%"></div></div></div>
      <div class="scene-title">你的挑戰結果</div><p class="learning-note">學習統整｜回顧行動、肯定有效策略，再思考下次可以怎麼調整。</p>
      <div class="result-hero">
        <div>
          <div class="path">${esc(route)}</div>
          <div class="result-grid">
            <div class="resultBox"><h3>① 你的因應行動</h3><p>${actionList}</p></div>
            <div class="resultBox"><h3>② 你表現好的地方</h3><p>${esc(fb[0])}</p></div>
            <div class="resultBox"><h3>③ 你可以這樣做會更棒</h3><p>${esc(fb[1])}</p></div>
            <div class="resultBox cert ${isPass?"pass":"retry"}"><h3>④ 關卡認證</h3><p>${esc(fb[2])}</p>${isPass ? '<p class="cert-stamp">【請你相信】</p>' : ""}</div>
          </div>
        </div>
        ${trophyBlock}
      </div>
      <div class="actions"><button class="btn secondary" onclick="goBack()">返回上一個情境</button><button class="btn" onclick="restartChallenge(false)">再挑戰一次</button><button class="btn ghost" onclick="returnHome()">回首頁</button></div>
    </section>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
renderHome(true);
</script>
